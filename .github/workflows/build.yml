# macOS / Linux 版：测试、打包、冒烟测试（PyInstaller 不能交叉编译，只能在各自的系统上打包）
#
# 触发：
#   - 推送 v* 标签（tools/release.py 发版时）：打包后把 dmg / tar.gz、补丁包、未签名的清单上传到该标签的发布草稿，
#     本机的 release.py 再给清单签名（私钥不进 GitHub）
#   - 推送 ci/** 分支、或在 Actions 页面手动运行：只测试和打包，产物在本次运行的 Artifacts 里下载
# Windows 版仍在发布者本机打包（build.bat / tools/release.py）。

name: Build macOS / Linux

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: write          # 上传到发布草稿

env:
  PYTHON_VERSION: "3.14"
  # 失败时把日志最后 80 行写成一条 error 注释：公开仓库的完整日志要登录才能下载，注释不用
  SHOW_TAIL: 'echo "::error title=log tail::$(tail -80 step.log | sed -e "s/%/%25/g" | awk 1 ORS="%0A")"' 
  LINUX_APT: >-
    xvfb imagemagick fonts-noto-cjk libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0
    libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libegl1 libnss3
    libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxkbfile1 libxcb-xkb1 libxcb-util1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q -p no:cacheprovider > step.log 2>&1 || { tail -80 step.log; eval "$SHOW_TAIL"; exit 1; }

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14              # Apple 芯片
            target: macos-arm64
          - os: macos-15-intel        # Intel
            target: macos-x86_64
          - os: ubuntu-22.04          # glibc 2.35：较老的系统也能运行
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q $LINUX_APT
      - name: Install
        run: |
          python -m pip install -r requirements.txt pyinstaller pillow
          if [ "$RUNNER_OS" = "Linux" ]; then python -m pip install "pywebview[qt]"; fi
      - name: Check target
        run: test "$(python -c 'from simplequant.system import TARGET; print(TARGET)')" = "${{ matrix.target }}"
      - name: Build
        run: PYTHON=python sh tools/build_unix.sh > step.log 2>&1 || { tail -80 step.log; eval "$SHOW_TAIL"; exit 1; }
      - name: Gatekeeper (macOS)
        # 模拟从网上下载（加隔离标记）：记录 Gatekeeper 的判定（未公证，应为 rejected），再验证 README 里的放行命令能去掉标记
        if: runner.os == 'macOS'
        run: |
          APP=dist/macos/SimpleQuant.app
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$APP"
          { echo "quarantined:"; spctl --assess --type execute -v "$APP" 2>&1 || true; } | tee gatekeeper-${{ matrix.target }}.txt
          xattr -dr com.apple.quarantine "$APP"
          if xattr -p com.apple.quarantine "$APP" 2>/dev/null; then echo "::error::quarantine still set"; exit 1; fi
          echo "after xattr -dr: quarantine removed" | tee -a gatekeeper-${{ matrix.target }}.txt
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: python tools/smoke_test.py dist/macos/SimpleQuant.app/Contents/MacOS/SimpleQuant --screenshot screenshot-${{ matrix.target }}.png --ui tools/ui_walkthrough.py --ui-out ui-${{ matrix.target }} > step.log 2>&1 || { tail -80 step.log; eval "$SHOW_TAIL"; exit 1; }
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tools/smoke_test.py dist/linux/SimpleQuant/SimpleQuant --screenshot screenshot-${{ matrix.target }}.png --ui tools/ui_walkthrough.py --ui-out ui-${{ matrix.target }} > step.log 2>&1 || { tail -80 step.log; eval "$SHOW_TAIL"; exit 1; }
      - name: Manifest and patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release.py ci ${{ startsWith(github.ref, 'refs/tags/v') && '--upload' || '' }} > step.log 2>&1 || { tail -80 step.log; eval "$SHOW_TAIL"; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: SimpleQuant-${{ matrix.target }}
          path: |
            dist/*/*.dmg
            dist/*/*.tar.gz
            dist/release/*/*/manifest-*.json
            screenshot-*.png
            gatekeeper-*.txt
            ui-*/
          if-no-files-found: warn
          retention-days: 14
